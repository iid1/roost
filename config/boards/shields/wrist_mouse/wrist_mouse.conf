# Split keyboard peripheral role configuration
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# Enable mouse pointing feature (ZMK Pointing API)
CONFIG_ZMK_POINTING=y

# Enable SPI driver and input subsystem
CONFIG_SPI=y
CONFIG_INPUT=y

# Enable dedicated thread for PMW3360 driver for enhanced responsiveness
CONFIG_INPUT_PIXART_PMW3360_USE_OWN_THREAD=y

# Boost BLE transmit power (+8dBm) for stable wireless link
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Battery status reporting
CONFIG_ZMK_BATTERY_REPORTING=y

# Power-saving sleep configuration (sleep after 15 min idle)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
