# Split keyboard central role configuration
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Maximum Bluetooth connections (3 PCs + 1 peripheral = 4 connections)
CONFIG_BT_MAX_CONN=4
CONFIG_BT_MAX_PAIRED=4

# Enable mouse pointing (clicks, scroll, etc.)
CONFIG_ZMK_POINTING=y

# Enable rotary encoder (EC11)
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Battery status reporting
CONFIG_ZMK_BATTERY_REPORTING=y

# Boost Bluetooth transmit power (+8dBm) for stable wireless connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Deep sleep configuration (enter low-power sleep after 15 min idle)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
